[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glimpser"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.16.1",
    "apscheduler==3.11.0",
    "fake-useragent==2.2.0",
    "filelock>=3.12",
    "flask==3.1.1",
    "flask-apscheduler==1.13.1",
    "flask-login==0.6.3",
    "jinja2==3.1.6",
    "numpy>=1.26,<2.0",
    "pdf2image==1.17.0",
    "pillow==11.2.1",
    "psutil~=7.0.0",
    "pynput==1.8.1",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.1.0",
    "pyvirtualdisplay==3.0",
    "pywebpush==2.0.3",
    "pyyaml>=6.0",
    "selenium==4.33.0",
    "setproctitle==1.3.3",
    "sqlalchemy==2.0.41",
    "undetected-chromedriver==3.5.5",
    "webdriver-manager==4.0.2",
    "werkzeug==3.1.3",
    "yt-dlp==2025.5.22",
    "onnxruntime-gpu~=1.18; sys_platform != 'darwin'",
    "onnxruntime~=1.18; sys_platform == 'darwin'",
    "gunicorn>=22.0.0",
    "rich>=13.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ["py311"]
required-version = "25.1.0"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
norecursedirs = ["debian"]

[dependency-groups]
dev = [
    "black>=25.1",
    "coverage>=7.5",
    "detect-secrets>=1.4",
    "flake8>=7.2",
    "isort>=5.13",
    "mkdocs>=1.6",
    "mypy==1.16.*",
    "pip-audit>=2.7",
    "pre-commit>=3.6",
    "pyinstaller>=6.14.1",
    "pylint>=3.1",
    "pytest>=8.3,<8.5",
    "pytest-socket>=0.7",
    "setuptools>=78.1.1",
    "sqlalchemy2-stubs>=0.0.2a38",
    "types-python-dateutil>=2.9",
    "types-requests>=2.31",
    "typing-extensions>=4.11",
]
