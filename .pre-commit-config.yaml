minimum_pre_commit_version: "3.6.0"
# All hooks must be local to allow offline usage

# ─── PYTHON ────────────────────────────────────────────────────────────────────
# NOTE: Ruff replaces Black, isort, and flake8 for faster, unified linting and formatting
repos:
  - repo: local
    hooks:
      # 1️⃣  Ruff linter - fast Python linter (replaces flake8, isort checks)
      - id: ruff-check
        name: ruff lint
        entry: ruff check --fix
        language: system
        types: [python]

  - repo: local
    hooks:
      # 2️⃣  Ruff formatter - fast Python formatter (replaces Black)
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]

  - repo: local
    hooks:
      # 4️⃣  mypy is expensive – run it only when you push (or manually)
      - id: mypy
        name: mypy (push only)
        entry: mypy --config-file=mypy.ini
        language: system
        types: [python]
        stages: [pre-push]

  # ─── JAVASCRIPT / CSS ──────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: lint-js
        name: lint js
        entry: npm run lint:js
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: format-js
        name: format js write
        entry: npm run format:js:write
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: lint-css
        name: lint css
        entry: npm run lint:css
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: check-exclude-docs
        name: docs exclude list in sync
        entry: python scripts/check_exclude_docs.py
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: detect-secrets
        name: detect secrets
        entry: detect-secrets-hook
        language: system
